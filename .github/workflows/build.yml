name: build

on:
  push:
  pull_request:

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release DLL
        run: cargo build --release
      - name: Verify oracle output
        shell: pwsh
        run: |
          if (-not (Test-Path 'target\release\xinput1_4.dll')) { throw 'xinput1_4.dll missing' }

      - name: Build ReShade calibration add-on
        shell: pwsh
        run: .\addon\build.ps1

      - name: Verify add-on output
        shell: pwsh
        run: |
          if (-not (Test-Path 'addon\bin\ACZCalibrate.addon64')) { throw 'ACZCalibrate.addon64 missing' }

      - uses: actions/upload-artifact@v4
        with:
          name: ACZRenderOracle-xinput1_4
          path: target/release/xinput1_4.dll

      - uses: actions/upload-artifact@v4
        with:
          name: ACZCalibrate-ReShade-6.8.0
          path: addon/bin/ACZCalibrate.addon64
