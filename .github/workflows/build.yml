name: build

on:
  push:
  pull_request:

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release DLL
        run: cargo build --release
      - name: Verify output
        shell: pwsh
        run: |
          if (-not (Test-Path 'target\release\winmm.dll')) { throw 'winmm.dll missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: ACZRenderOracle-winmm
          path: target/release/winmm.dll
