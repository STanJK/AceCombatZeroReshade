name: coop-rust-foundation
on:
  push:
    paths: ['coop/**', 'docs/mp/**', 'docs/reverse-engineering/coop/**', '.github/workflows/coop.yml', '.gitattributes']
  pull_request:
    paths: ['coop/**', 'docs/mp/**', 'docs/reverse-engineering/coop/**', '.github/workflows/coop.yml', '.gitattributes']
jobs:
  modules:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - if: runner.os != 'Windows'
        run: cargo fmt --manifest-path coop/Cargo.toml --all -- --check
      - if: runner.os != 'Windows'
        run: cargo test --manifest-path coop/Cargo.toml --workspace --locked
      - if: runner.os != 'Windows'
        run: cargo clippy --manifest-path coop/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - run: python coop/tools/verify_interfaces.py
      - run: python tools/ghidra/verify_coop_archive.py
      - name: Stage Windows observer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./coop/scripts/Build-Coop.ps1
      - name: Verify Windows exports
        if: runner.os == 'Windows'
        run: python coop/tools/verify_interfaces.py --dll coop/dist/ACZCoop-observer/ACZCoop.addon64
      - name: Run Windows release CLI model
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./coop/dist/ACZCoop-observer/acz-coop.exe demo
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ACZCoop-read-only-observer-Windows-x64
          path: coop/dist/ACZCoop-observer/
