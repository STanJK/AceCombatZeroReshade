[package]
name = "acz-coop-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lib]
name = "acz_coop_runtime"
crate-type = ["cdylib", "rlib"]
[dependencies]
acz-coop-contracts.workspace = true
acz-coop-game.workspace = true
acz-coop-trace.workspace = true
[target.'cfg(windows)'.dependencies]
minhook-sys = "=0.1.1"
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading",
  "Win32_System_Diagnostics_Debug",
] }
